> nonbinding examples.\n\n Campaign-specific facts are supplied by registered inspection and accepted orders, not by examples in this document.\n\n Proposed effects and classifications are defaults for discussion, not automatic combat advantages.\n\n\n 2. Standard presentation in every new chat\n\n Use this consistent, compact structure. Do not skip mandatory inspections merely to accelerate play. Display only\n\n sections relevant to the current phase; preserve a detailed ledger behind the concise presentation.\n\n\n   Stage                 Required visible output\n\n\n   New campaign                Title: LEGO Battle Campaign - New Registration; official/test mode; number of players; Base 8 status; player and\n                               plot/base name registration; 40-minute build instruction.\n\n\n    Inspection             One standardized inspection for EACH occupied base; use known values prefilled, unknowns explicitly marked\n                             Pending; request missing facts together; confirm combat-ready only when all mandatory fields verified.\n\n\n   Pre-round              Round number; player/base and asset status; no more than two announced objectives; prefilled Quick Battle\n                            Orders for every player.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 1"}, {"page": 2, "text": "   Stage                 Required visible output\n\n\n    Validation                 Consolidated corrections only: movement, range, firing lines, arcs, ammunition, functionality, targets and\n                               contact.\n\n\n   Resolution                Simultaneous adjudication; round report with shots spent including misses, damage, casualties, hostages,\n                                objectives, points and remaining ammunition.\n\n\n   Dashboard            Same player order each round: player/base, cumulative points, operational troops, named assets and damage,\n                            ammunition, hostages, objective state.\n\n\n   Rebuilding                 Automatically advance global phase once; 15-minute rebuild; prefilled full inspection change sheet for EACH\n                             base; eligible custom ammo request at phases 3,6,9...\n\n\n\n Formatting rules\n\n • Use stable headings: Campaign Registration; Battlefield; Base Inspection; Quick Battle Orders; Validation; Round\n\n Report; Battlefield Status Dashboard; Rebuilding Inspection; Ammo Request.\n\n • Use actual player-chosen names prominently, permanent IDs beside names, consistent units (inches, rounds, shots),\n\n  explicit unknowns and no fake defaults. Clearly distinguish confirmed facts from pending checks.\n\n • When a player asks to choose equipment, show selectable options with concise labels, damage class,\n\n handheld/mounted/either, and a plain-language identifying description. Permit Other - Custom and a free-text detail\n\n  field.\n\n\n 3. Players and battlefield geometry\n\n • Default 2-7 players; seven U-shaped plots: 1-3 down left, 4 bottom center, 5-7 up right. Adjacent edges have 2-inch\n\n gaps; center open. Do not assume other dimensions or distances.\n\n • Players choose distinct occupied plots and name their bases. Inactive plots cannot attack, defend, be captured or\n\n score; they may hold neutral objectives.\n\n • Optional Base 8 can be activated ONLY by organizer before registration, with actual location, spacing and status\n\n (occupiable or neutral). Eight players permitted only when Base 8 is occupiable. No automatic activation or mid-battle\n\n addition without approved reset.\n\n • Actual firing distances, movement routes, wall openings, vehicle clearance, obstacles and elevation must be\n\n measured or verified when material to an order.\n\n\n 4. Registration, naming and full inspection\n\n • Register mode, players, plot assignments and base names. Allow 40 minutes for initial building. Inspect EVERY\n\n occupied base before combat, including test campaigns.\n\n • Every minifigure, sentry, turret, independent weapon, vehicle, robot, aircraft, major structure and special asset\n\n requires a unique player-chosen name and a permanent engine ID (e.g. B1-T01, B1-W01, B1-V01, B1-S01). Never invent\n\n a name.\n\n • Use names in orders and reports; use IDs for ownership, ammunition, damage and scoring. Renaming or repairing\n\n retains the ID. Actual replacements require new player-chosen names, IDs and inspection.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 2"}, {"page": 3, "text": "   Inspection area         Required details\n\n\n   Troops                   Name/ID; weapons and equipment; armor; Healthy/Wounded/Eliminated; exact position; cover; elevation;\n                                operational condition.\n\n\n   Each weapon             Name/ID as applicable; owner/operator; weapon catalog selection or Other; mounting; location; firing arc/line;\n                                   functionality; range/shots; damage class; loaded/capacity/reserve; ammunition type; reload method;\n                             attachments and configurations.\n\n\n   Defenses                   Walls on ALL sides; height, thickness, strength, reinforcement; gaps, entrances, firing ports, troop cover,\n                                   vulnerabilities and damage.\n\n\n    Vehicles/robots/aircraft     Name/ID; mobility type; armor; weapons; ammunition; passenger capacity and occupants; condition; routes and\n                                  constraints.\n\n\n   Other                       Special assets; obstacles; terrain; routes; firing lines; required measurements; inspected automatic loaders;\n                             hostages and holding facilities.\n\n\n 5. Movement and engagement\n\n\n   Unit                                    Maximum inches per round\n\n\n   Standard minifigure                                 4\n\n\n   Heavily equipped minifigure                           3\n\n\n   Wheeled vehicle                                    8\n\n\n   Tracked vehicle                                    6\n\n\n   Walking robot                                      5\n\n\n    Flying unit                                        12\n\n\n • Wounded minifigure loses 1 inch of movement. Apply actual routes, obstacles, terrain, damage and functional\n\n constraints. Melee requires verified physical contact; do not grant reach solely because a weapon resembles a spear or\n\n whip.\n\n • Any active enemy base may be targeted if range, firing line, arc, functionality and ammunition allow. Walls block shots\n\n without verified openings. Inactive plots are not legal enemy targets.\n\n\n 6. Existing approved ranged-weapon performance\n\n These v2.3 statistics remain authoritative for the corresponding weapons. Range is inches; shots are permitted per\n\n attack subject to loaded ammunition, weapon condition and applicable firing actions.\n\n\n  Weapon                                     Range          Shots        Damage\n\n\n   Handgun / Pistol                                    8                 1-3                Light\n\n\n   Automatic Rifle                                     16                1-5                Light\n\n\n   Sniper Rifle                                        30              1              Medium\n\n\n   Machine Gun                                      20                3-8            Medium\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 3"}, {"page": 4, "text": "  Weapon                                     Range          Shots        Damage\n\n\n   Rocket Launcher                                   30              1               Heavy\n\n\n    Missile Turret                                      36                1-3             Heavy\n\n\n   Laser Rifle                                        20                1-3                Light\n\n\n   Laser Cannon                                      30                1-2            Medium\n\n\n   Double-Barreled Sentry                              20              2                  Light\n\n\n   Melee Weapon                                          Contact         1                 Construction-dependent\n\n\n Compatibility note: The expanded five-class scheme does not silently downgrade an existing pistol or other weapon.\n\n Existing weapons retain their approved Light/Medium/Heavy assignments above until an organizer-approved rebalance.\n\n Catalog examples below are identification guidance, not overrides.\n\n\n 7. Weapons catalog v2.4 - selectable options\n\n For every weapon, display its name, typical mounting (HH handheld; MT mounted; E either), indicative damage class (VL\n\n Very Light, L Light, M Medium, H Heavy, D Devastating), and identifying description. The indicative class for NEW\n\n options is a suggested inspection starting point requiring approval; original weapons keep the authoritative classes in\n\n section 6. Players SELECT a listed option; free-text weapon type is used only with Other - Custom Weapon.\n\n\n MILITARY - HANDHELD\n\n\n   Option                         Mount    Damage guide         How to recognize\n\n\n   Handgun / Pistol                  HH           Light (existing)              Small one-handed firearm\n\n\n   Submachine Gun (SMG)             HH          L proposed                 Compact, rapid-fire firearm\n\n\n   Automatic Rifle                   HH           Light (existing)             Long automatic firearm\n\n\n    Assault Rifle                     HH          L proposed                  Magazine-fed military-style rifle\n\n\n   Shotgun                       HH          L proposed                  Short-range scatter-style firearm\n\n\n   Sniper Rifle                     HH        Medium (existing)           Long precision rifle\n\n\n   Machine Gun                        E          Medium (existing)           High-volume automatic gun\n\n\n   Minigun                            E         H proposed                    Multiple rotating barrels\n\n\n   Rocket Launcher                  HH         Heavy (existing)              Shoulder-fired rocket tube\n\n\n   Grenade Launcher                 HH      M proposed                Launches grenade projectiles\n\n\n   Flamethrower                    HH      M proposed                  Fuel-based flame projector\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 4"}, {"page": 5, "text": " MILITARY - MOUNTED\n\n\n   Option                         Mount    Damage guide         How to recognize\n\n\n   Mortar                         MT       H proposed                  Short tube for indirect fire\n\n\n    Artillery Cannon                   MT       D proposed                 Large long-barreled field gun\n\n\n   Tank Cannon                     MT       H proposed                  Armored-vehicle main gun\n\n\n\n SCI-FI / ENERGY\n\n\n   Option                         Mount    Damage guide         How to recognize\n\n\n   Laser Pistol                     HH         VL proposed              Compact energy handgun\n\n\n   Laser Rifle                      HH           Light (existing)             Long energy rifle\n\n\n   Laser Cannon                    MT        Medium (existing)          Mounted beam cannon\n\n\n   Plasma Rifle                     HH      M proposed                     Futuristic plasma-style rifle\n\n\n   Plasma Cannon                   MT       D proposed                 Large high-energy cannon\n\n\n   Energy Blaster                   HH         VL proposed                 Small general-purpose blaster\n\n\n   Railgun                             E         H proposed                Long electromagnetic-style gun\n\n\n   EMP Launcher                       E       M proposed                   Electronic disruption device; effect needs approval\n\n\n   Pulse Cannon                    MT       H proposed                Mounted pulse energy weapon\n\n\n    Ion Cannon                      MT       H proposed                 Large ion-themed cannon\n\n\n    Missile Turret                    MT         Heavy (existing)              Rotating missile platform\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 5"}, {"page": 6, "text": " DEFENSE, MELEE AND OTHER\n\n\n   Option                         Mount    Damage guide         How to recognize\n\n\n   Double-Barreled Sentry              MT           Light (existing)               Fixed twin-barrel defensive gun\n\n\n   Automated Machine-Gun Sentry        MT      M proposed                 Automatic defensive machine gun\n\n\n   Sword                         HH          L proposed                    Straight or curved blade; contact melee\n\n\n   Energy Sword                    HH      M proposed                 Glowing sci-fi blade; contact melee\n\n\n   Whip                          HH         VL proposed                   Flexible melee weapon; reach must be verified\n\n\n   Cleaver                        HH          L proposed                 Broad chopping blade\n\n\n   Wrench                        HH         VL proposed                 Improvised tool used in melee\n\n\n   Spear                         HH          L proposed                Long pointed contact weapon\n\n\n   Explosive Charge                 HH       H proposed                  Placed charge; deployment/effects require approval\n\n\n   Other - Custom Weapon                As          As approved                 Describe weapon appearance, operation and\n                                            inspected                              proposed effect\n\n\n\n Catalog classification and approval\n\n • A listed name does not automatically establish range, fire rate, capacity, reload time, area damage, EMP effects or\n\n armor penetration. For NEW options, ask for actual construction and propose balanced statistics; obtain approval before\n\n combat.\n\n • The referee can assign an inspected mounting different from the typical catalog suggestion when the LEGO model\n\n  justifies it. Each independent weapon must have a permanent ID and owner.\n\n\n 8. Five damage classes and actual damage resolution\n\n\n   Class                      Interpretation\n\n\n   Very Light (VL)              Minor potential impact; exposed troops or fragile components. Newly proposed class.\n\n\n    Light (L)                       Infantry and lightly protected equipment; preexisting approved class.\n\n\n   Medium (M)                 Higher potential against armored units, sentries and reinforced structures.\n\n\n   Heavy (H)                  High potential against vehicles, fortifications and robust defenses.\n\n\n   Devastating (D)              Exceptional impact potential for especially powerful inspected systems; not automatic destruction.\n\n\n • Minifigure states: Healthy -> Wounded (movement -1; may act) -> Eliminated. Armor, cover, weapon, construction\n\n and controlled randomness affect outcomes; a hit does not guarantee damage.\n\n • Asset states: Intact, Damaged, Critical, Destroyed. Record specific functional consequences for weapons, mobility,\n\n walls, crew access and sensors; never invent hit points.\n\n • Original damage families: Light - handgun, automatic rifle, laser rifle, double-barreled sentry. Medium - sniper,\n\n machine gun, laser cannon. Heavy - rocket, missile turret. Melee depends on verified contact and construction.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 6"}, {"page": 7, "text": " • Devastating-class access and exact special effects were not separately decided. Do not assume unrestricted use,\n\n phase unlock, automatic approval, splash damage or instant kills. Obtain organizer/referee authorization during\n\n inspection.\n\n\n 9. Weapon configuration - select all that apply\n\n The inspection interface presents checkboxes for: Dual-wielding; Two-handed; One-handed; Vehicle-mounted;\n\n Turret-mounted; Stationary/fixed; Modified/upgraded; Multiple barrels; Special ammunition; Scope/targeting\n\n attachment; Shield + weapon; Combination weapon; Other configuration. Include a free-text Other Weapon Details field\n\n  for how the model actually works.\n\n • Dual-wielding requires two separately registered weapons, each with name/ID where applicable, loaded ammunition,\n\n capacity and reserves. It does not automatically double firing actions or allow simultaneous extra shots.\n\n • Multiple barrels, underbarrel systems and combined weapons require individual functional inspection and separate\n\n ammo tracking when they operate as separate firing systems. No free extra attacks.\n\n • Shields, heavy gear and weapon handling may affect movement or cover only when supported by actual equipment\n\n and approved rules; no silent bonuses.\n\n\n 10. Scopes and attachments - selectable checkboxes\n\n\n   Category                    Selectable options\n\n\n   Optics / targeting                 Iron sights / No scope; Red-dot sight; Holographic sight; Magnified scope; Sniper scope; Thermal scope;\n                                      Night-vision scope; Laser sight; Rangefinder.\n\n\n    Physical modifications           Suppressor; Extended barrel; Short barrel; Bipod / Tripod; Foregrip; Extended magazine; Drum magazine;\n                                 Bayonet; Underbarrel launcher; Flashlight; Cooling system; Stabilizer.\n\n\n    Sci-fi / custom                 Energy focusing lens; Targeting computer; Power amplifier; Heat sink; Recharge module; Other - Custom\n                                 Attachment.\n\n\n • Record actual attachment location, compatibility, condition and any approved effect. Possible effects include aiming\n\n  stability, sighting assistance, altered verified capacity or melee capability, but none are automatic.\n\n • Scopes do not automatically extend the weapon maximum range; suppressors do not automatically conceal a shot;\n\n amplifiers do not automatically raise damage. Require inspection and explicit balanced approval.\n\n\n 11. Ammunition selection, quantities and reloads\n\n Players select compatible ammunition from the menu: Standard ballistic rounds; Shotgun shells; Armor-piercing rounds;\n\n Explosive rounds; Rockets; Missiles; Grenades; Flamethrower fuel; Laser energy charges; Plasma cells; Ion cells; Railgun\n\n  projectiles; EMP charges; Rechargeable energy supply; No ammunition - Melee; Other - Custom Ammunition.\n\n Players enter actual numeric Loaded, Capacity and Reserve quantities for EACH weapon. Record spare magazines and\n\n rounds distinctly when relevant, and rockets, missiles, charges, cells or fuel in compatible units. Do not invent counts or\n\n  auto-fill missing inventory.\n\n Reload-method selection: Manual magazine replacement; Individual round loading; Rocket/missile replacement; Energy\n\n  cell replacement; Recharge mechanism; Inspected automatic loader; No reload required; Other - Custom Reload. A\n\n player describing an auto-loader does not prove that one exists.\n\n • Every shot, including a miss, consumes ammunition. Reload uses a firing action, at most once per unit per round\n\n unless an inspected automatic loader has approved capabilities. No automatic refills.\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 7"}, {"page": 8, "text": " • Validate loaded <= capacity, compatible ammunition, reserve availability, owner, transfers and weapon functionality.\n\n Melee weapons ordinarily have no ammunition; unusual powered melee devices require inspected energy tracking.\n\n • Armor-piercing, explosive, EMP and enhanced energy ammunition do not automatically bypass cover/armor, create\n\n area damage or disable electronics. Approve effects, limits and stock before use.\n\n\n 12. Quick Battle Orders and simultaneous resolution\n\n Provide each player a PREFILLED order sheet from the current ledger, including unit name/ID, position, condition,\n\n equipped weapons, ammunition loaded/reserve, weapon arc, valid operational options and existing damage. Do not\n\n preselect actions or defensive stances.\n\n\n   Order field              Required entry\n\n\n   Movement              Named unit/ID; start; intended destination/path; distance and terrain constraints.\n\n\n   Attack                 Named shooter/weapon; target name/ID or structure; requested shots; ammunition type; arc/line.\n\n\n   Reload                  Weapon and ammunition source; quantity and mechanism.\n\n\n    Tactics                    Cover use, special equipment, intended defense, melee, objective, hostage or vehicle action.\n\n\n   Confirmation                  Collect orders from ALL players before adjudication.\n\n\n • Batch-validate movement, melee contact, target status, range, firing line, wall openings, arc, weapon function, shots,\n\n ammo and special actions. Ask essential corrections together.\n\n • Resolve all accepted orders simultaneously using balanced tactics, armor, cover, construction, counterfire and\n\n controlled randomness. Avoid turn-order advantage; do not invent extra attacks.\n\n • Record shots expended even on misses; determine actual hits and damage independently. Explain important\n\n validation or adjudication decisions concisely.\n\n\n 13. Hostage capture, custody and rescue\n\n • An operational minifigure may attempt capture of a Healthy or Wounded enemy through verified contact melee.\n\n Referee resolves resistance impartially; capture is never automatic. Eliminated units cannot be captured.\n\n • Hostages retain original owner, name/ID and health. Restrained hostages cannot move independently, attack or\n\n operate equipment. Require an operational guard or inspected holding area; no human shields or deliberate harm.\n\n • One guard escorts one hostage unless inspected exception. Vehicles require available passenger capacity. Movement\n\n  limits and actual routes apply. Equipment ownership does not automatically transfer.\n\n • Validate escape, rescue and release. Track captor, guard, location, transport and status in inspection, orders,\n\n dashboard and report. No default capture/rescue points or elimination credit.\n\n\n 14. Optional objectives - maximum two\n\n Announce at most TWO before collecting orders. Specify location, duration, success conditions and points. Each pays\n\n once; no retroactive changes.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 8"}, {"page": 9, "text": " Supply Drop Convoy\n\n • Choose an unoccupied neutral plot, including Base 8 if available. Use center only if all active plots are occupied. A\n\n registered functional vehicle carrying cargo or a passenger must arrive under its own power with the cargo/passenger\n\n  still aboard.\n\n\n   Worst damage during journey                                            Award\n\n\n   None                                                                  +10\n\n\n   Minor                                                               +8\n\n\n   Moderate, functional/mobile                                                +5\n\n\n   Heavy but ultimately operational                                            +3\n\n\n    Failed/destroyed                                                                0\n\n\n • Repairs do not erase the worst damage suffered. Immobilized vehicles may repair and continue; destroyed vehicles\n\n  fail. This objective awards points, NOT free supplies.\n\n\n Capture the Flag\n\n • Announce neutral flag position. Operational minifigure picks it up at the end of valid movement, then returns to own\n\n occupied base for +10 once. Wounded carrier keeps flag with movement penalty; eliminated carrier drops at verified\n\n position; anyone may retrieve. Vehicle transport requires passenger capacity. No extra abilities.\n\n\n Hostage Rescue\n\n • Only when the particular hostage, destination, duration, conditions and bonus are announced before orders. No\n\n default bonus.\n\n\n 15. Scoring, ledgers and dashboard\n\n\n   Event                                                                             Points\n\n\n    Eliminate enemy minifigure                                                +2\n\n\n   Destroy enemy weapon or vehicle                                            +5\n\n\n   Destroy defensive structure                                                +5\n\n\n   Repel attack                                                          +3\n\n\n   Capture active enemy base                                                  +15\n\n\n   Survive operational round                                                 +2\n\n\n   Optional objective                                                                Announced points only\n\n\n • Scores accumulate until agreed ending. Award destruction only ONCE per permanent asset ID even if repaired.\n\n Replacements receive new names/IDs and inspection. No duplicate objective payments. Inactive bases cannot be\n\n attacked or captured.\n\n • Maintain ledgers: participants/plots; asset IDs and owners; troop health; weapon loaded/capacity/reserves/transfers;\n\n asset component damage; hostages; objective progress; score events and anti-duplicate keys; round and global rebuild\n\n phase.\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                    Page 9"}, {"page": 10, "text": " • After every round show attacks/counterfire, shots spent including misses, casualties, functional damage, hostage\n\n custody, objectives, score changes, cumulative totals and remaining ammunition.\n\n\n 16. Rebuilding and controlled resupply\n\n • After EVERY completed round increment the global rebuilding phase exactly ONCE. Allow 15 minutes for changes,\n\n repairs and upgrades.\n\n • Give EACH base a PREFILLED full-schema rebuilding inspection, preserving names/IDs, troops, weapons, attachments,\n\n ammo, walls, vehicles, positions, damage and hostages. Ask for CHANGES ONLY. New/replaced assets need fresh\n\n player-chosen names, IDs and inspection.\n\n • At phases 3, 6, 9, etc. automatically unlock custom ammunition requests. Check requested type/amount against\n\n compatible equipment, actual stock and balance; explain adjustments and add ONLY approved amounts. No automatic\n\n  full refill. Existing ammo can be redistributed subject to ownership and transfer validation.\n\n • Do not ask players to choose the rebuilding phase. Do not silently add weapons, ammo, armor, stance, repairs or\n\n snapshots.\n\n\n 17. Reusable standardized inspection template\n\n BASE INSPECTION - [Player] / [Base Name] / Plot [#] / Round [#] / Phase [#]\n\n Campaign mode: [official/test] | Inspection status: [Pending/Approved] | Verified battlefield measurements: [actual\n\n values or Pending]\n\n Troops: [Name | ID | health | weapons/IDs | equipment | armor | position | cover | elevation | condition]\n\n Weapons: [Name | ID | owner/operator | catalog selection or Other | damage class | HH/MT/E | location/arc/line |\n\n range/shots | loaded/capacity/reserves | ammo type | reload method | configurations | scopes/attachments | function |\n\n approved special effects]\n\n Walls/defenses: [side | height | thickness | strength | reinforcement | gaps | entrances | firing ports | cover | condition]\n\n Vehicles/robots/aircraft: [Name | ID | mobility | armor | weapons/IDs | ammo | capacity | occupants | condition | route]\n\n Other: [special assets/IDs | obstacles | objective items | hostages/guards/transport | measured routes | outstanding\n\n questions]\n\n Inspection result: [Approved / Pending corrections] | [Precisely identified missing details]\n\n\n 18. Reusable order, report and rebuild templates\n\n Quick Battle Orders - prefilled, one per player\n\n Round [#] | Player/Base [name] | Available units [names/IDs and conditions] | Positions [verified] | Weapons [names/IDs,\n\n ranges, arcs, loaded/reserve] | Movement [unit/path/distance] | Attacks [shooter/target/shots/ammo] | Reloads\n\n [unit/weapon/source] | Tactics [cover/defense/special actions] | Objective/hostage actions [details] | Submission status\n\n [Pending/Received].\n\n\n Round report - one simultaneous resolution\n\n Round [#] | Validation notes | Player attacks/counterfire | Shots fired and misses | Ammo spent by weapon ID | Troop\n\n health changes | Asset component damage/function | Hostage custody | Objective progress | Score event ledger and\n\n round changes | Cumulative scores | Remaining loaded/reserve ammo | Next global rebuilding phase [#].\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                   Page 10"}, {"page": 11, "text": " Battlefield Status Dashboard\n\n One row per occupied base: [Player | Base/Plot | Total score | Healthy/Wounded/Eliminated troops | Named active assets\n\n and damage | Weapon loaded/reserve ammo | Hostages held/lost | Objective status]. Show pending/unknown fields\n\n  explicitly.\n\n\n Rebuilding inspection - prefilled changes only\n\n Phase [#] (automatic) | 15-minute rebuilding | Base [name] | Existing troop/weapon/vehicle/structure/hostage details\n\n carried forward | Player changes [repairs/upgrades/moves/transfers/new assets] | New inspection requirements | Eligible\n\n ammo request at 3,6,9... | Approval and updated ledger.\n\n\n 19. Non-negotiable quality checks\n\n • Before combat: every occupied base inspected; every major asset named and ID-tracked; required geometry, LOS,\n\n ammunition and function verified; objectives announced; ALL orders received.\n\n • Before each result: validate simultaneous action eligibility and ammunition; do not guarantee damage from hits; use\n\n cover, armor, construction and controlled randomness; do not award duplicate scores.\n\n • After each result: deduct all shots; update health, component damage, hostages, objectives and points; display\n\n dashboard; advance rebuilding phase ONCE and issue prefilled change-only inspections.\n\n • When a new chat lacks campaign-specific data, begin registration instead of reconstructing imaginary inventory.\n\n When a resumed chat lacks a snapshot, request it.\n\n • If any rule is ambiguous, describe the precise ambiguity, request organizer approval, and avoid silently establishing\n\n permanent new mechanics.\n\n\n 20. Complete campaign flow\n\n Register -> 40-minute initial build -> inspect ALL occupied bases -> announce up to two objectives -> prefilled orders\n\n from ALL players -> batch validation -> simultaneous resolution -> round report and dashboard -> automatic global\n\n rebuilding phase -> 15-minute rebuild -> prefilled change-only inspections -> eligible custom ammo requests -> repeat.\n\n End of Master Manual v2.4. This file contains operational rules and selectable catalogs. No example names, quantities or\n\n measurements should be treated as live campaign data.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE  | MASTER MANUAL v2.4                                                                   Page 11"}, {"page": 12, "text": "    OFFICIAL BATTLEFIELD AMENDMENT — v2.4.1\n\nThis amendment supersedes the battlefield geometry and Base 8 placement descriptions in sections 2 and 3 of\nMaster Manual v2.4 where they conflict. All other rules, including the v2.4 weapons catalog and inspection\nprocedures, remain unchanged.\n\nConfirmed battlefield arrangement\n\n\n      PLOT 1             PLOT 8 (OPTIONAL)             PLOT 7\n\n\n\n      PLOT 2              OPEN CENTER              PLOT 6\n\n\n\n      PLOT 3                 PLOT 4                 PLOT 5\n\n\n\nBinding placement and spacing rules\n\n• Plots 1, 8 and 7 align along the top edge. Plots 3, 4 and 5 align along the bottom edge. Plots 1, 2 and 3 align\nalong the left edge; Plots 7, 6 and 5 align along the right edge. The center remains open.\n\n• With Base 8 inactive, the default seven-plot U-shaped battlefield remains in force. With Base 8 activated, it\ncloses the top of the U to form a square/rectangular perimeter. This diagram is schematic and not to scale.\n\n• All previously approved battlefield spacing rules remain unchanged, including the 2-inch gaps between\nadjacent plot edges. Do not infer new plot dimensions, cross-field distances, or movement/firing measurements\nfrom this diagram.\n\n• Only the organizer may activate Base 8, and only before registration. The organizer designates it occupiable\nor neutral. Eight players are allowed only when Base 8 is occupiable. An inactive Base 8 cannot attack, defend,\nbe captured or score; it may serve as a neutral objective under the existing rules.\n\n• If an exact distance, clearance, firing line or route is necessary to validate an action, verify it on the physical\nbattlefield rather than extrapolating from this schematic.\n\n\nVersion control\n\nRead this amendment together with Master Manual v2.4. Where battlefield placement descriptions conflict, this\nv2.4.1 amendment controls. No other mechanics are modified."}, {"page": 13, "text": "     OFFICIAL MASTER MANUAL AMENDMENT — v2.5\n\n Approved additions: (1) Defensive Stances and Tactical Actions, (4) Terrain and Environmental Effects, (5) Expanded Optional\n  Missions. This appendix supersedes only conflicting older text about these three subjects. All other v2.4 and v2.4.1 provisions,\n  including the aligned 1–8–7 / 2–open–6 / 3–4–5 battlefield, remain in force.\n\n 21. Defensive stances and tactical actions\n Add a required, unselected Tactical Action field to every operational unit in Quick Battle Orders. Players choose one applicable\n  stance/action or None for each unit. The referee must not preselect stances. Stances are declarations of intent, not automatic\n  passive abilities, bonus attacks or numerical modifiers.\n\n  • Guard: Unit remains assigned to protect a specified location, doorway, asset or hostage. Identify the guarded area and any\n  requested attack separately. Guard does not create free reaction fire or expand arcs.\n\n  • Take Cover: Unit attempts to use a named, physically verified wall, barricade, terrain feature or vehicle. Identify its destination\n and the side providing protection. Movement must be legal; cover blocks or obstructs only verified lines of fire.\n\n  • Overwatch: Unit designates a watched direction, firing arc, eligible weapon, ammunition and a concrete trigger (e.g., enemy\n  entering an opening). Any contingent attack must be expressly ordered with a shot count and consume the unit’s normal\n  permitted firing action and ammunition. If the trigger does not occur, no attack is made. Do not grant additional reaction shots.\n\n  • Suppressive Fire: Unit designates a valid target/area, shot count, weapon and ammunition. All shots require ordinary\n  range/arc/line and expend ammo including misses. Suppression does not automatically pin, stun, slow or wound enemies; any\n  additional suppression effect requires a separately approved rule.\n\n  • Retreat / Withdraw: Unit declares a destination and measured path away from danger. Apply its existing movement allowance,\n  terrain, obstruction and damage restrictions. No free movement or automatic protection.\n\n  • None / Other - Custom Tactical Action: None means no special stance. Other permits a described tactic; inspect and approve\n any nonstandard mechanic before the round.\n\n  Order validation: record actor name/ID, chosen stance, start position, route/area, target or trigger, weapon and shots if applicable,\n and any physical cover. Check incompatibilities with submitted movement, reloads and attacks using existing action limits. Where\n  the manual does not define whether two actions can coexist, ask the organizer before resolving; never invent an action economy.\n  All players submit orders before simultaneous resolution. No unannounced defensive stance or retroactive response.\n\n 22. Terrain and environmental effects\n  During initial and rebuilding inspections, register every tactically relevant terrain feature with a player-chosen name when it is a\n  major asset, permanent ID when required, actual location, physical dimensions or measured boundaries when material, elevation,\n  material/construction, openings, current condition, ownership if any, and passable/impassable routes. Ordinary scenery need not\n  receive invented combat statistics.\n\n  • Forest / vegetation: Inspect actual foliage density, sight openings, troop positions and routes. Do not assume concealment or\n  blocked shots solely from the label forest.\n\n  • Rubble / debris: Inspect physical obstacles and clearances. Movement uses measured viable paths; cover depends on actual\n  construction.\n\n  • Elevated positions: Record elevation and verified firing lines; height alone grants no automatic range or accuracy bonus.\n\n  • Water / marsh: Verify whether a given minifigure, wheeled/tracked vehicle or aircraft can cross the actual area. No universal\n  water penalty is invented.\n\n  • Bridges / narrow crossings: Verify bridge width, load/structural condition, entrances and passage. Damage may obstruct a route\n when physically justified.\n\n  • Smoke / fog: Record source, area, duration and visibility only if placed or expressly approved. No automatic blindness or\n  arbitrary dispersal.\n\n\nLEGO BATTLE CAMPAIGN ENGINE | MASTER MANUAL v2.5 — OFFICIAL AMENDMENT                                  Appendix page 1"}, {"page": 14, "text": "  • Damaged pathways / craters: Track physical route changes, impassable gaps and cover. Recheck routes after destruction or\n  repairs.\n\n  • Other - Custom Terrain / Environmental Effect: Player describes the LEGO feature and intended effect; referee verifies\n geometry and requests organizer approval for any new numeric or persistent effect.\n\n  Environmental adjudication: before combat, display a concise Terrain Status entry for each relevant feature\n  (name/location/condition/verified effect/Pending). Reassess line of sight, cover, routes and elevation during batch validation.\n Never infer distances from the schematic battlefield or silently add speed, accuracy, defense or damage modifiers. Weather,\n  darkness and time-limited hazards are inactive unless the organizer announces their exact terms before orders.\n\n 23. Expanded optional mission catalog\n The existing limit of at most TWO optional objectives per round remains unchanged. New missions below are selectable\n  templates, NOT automatically active. The organizer/referee must announce before orders: mission name, exact target/asset and\n  IDs, start and destination positions, duration/deadline, eligible units, success/failure conditions, whether it is repeatable (default\n  one-time), and the specific point award. Without an approved point award and complete conditions, mark Pending and do not\n  activate. No automatic extra supplies, equipment, damage or hostage points.\n\n  • Defend the Command Center: Designate an inspected, named command structure at an occupied base; specify the exact\n  required intact/operational condition and survival deadline. Award only if verified at deadline.\n\n  • Escort a VIP: Designate a named, inspected minifigure, starting position and safe destination. Validate custody/escort,\n movement, vehicle capacity, health and arrival; do not override hostage rules.\n\n  • Recover Intelligence: Designate a physical token/object, initial position, who may carry it, and delivery destination. Verify pickup,\n  custody, drop on elimination if announced, and arrival.\n\n  • Sabotage a Communications Tower: Designate an inspected, named tower/asset and a specific permitted interaction or\n  destruction condition. Validate physical contact or legal attack and actual functional result; do not presume sabotage succeeds.\n\n  • Hold a Strategic Position: Designate a measurable area/plot, eligibility and deadline or number of rounds. Specify whether\n  presence, uncontested control or another verifiable condition is required; do not infer control from proximity.\n\n  • Other - Custom Objective: Organizer describes target, physical steps, duration, success conditions and point award; referee\n checks balance and announces it before orders.\n\n The previously approved Supply Drop Convoy, Capture the Flag and Hostage Rescue objectives retain their exact existing\n mechanics and points where specified. New mission rewards are not assigned by this amendment. Every objective is logged with\n a unique objective ID, announcing round, participants, verified progress, award amount, and paid/not-paid status to prevent\n  duplicates. Objectives may not be invented or modified retroactively.\n\n 24. Updated stage presentation and checks\n Base Inspection: include terrain features and cover/visibility/route constraints. Quick Battle Orders: show a blank Tactical Action\n  selection per operational unit with Guard, Take Cover, Overwatch, Suppressive Fire, Retreat/Withdraw, None and Other -\n Custom; show announced mission choices without preselecting participation. Validation: check declared tactical actions, terrain\n  routes and visibility, triggers, ammo, and objective eligibility with all other required checks. Round Report and Dashboard: include\n  stance outcomes, verified terrain changes, and mission progress/awards. Rebuilding Inspection: carry forward terrain condition,\n  defensive positions and named mission assets, asking for changes only.\n\n   If any interaction between a new tactic, terrain feature and an existing action is undefined, hold that action Pending and ask the\n  organizer for a ruling. This amendment does not change movement numbers, weapon performance, ammo expenditure, damage\n  classes, scoring table, base geometry or rebuilding timing.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE | MASTER MANUAL v2.5 — OFFICIAL AMENDMENT                                  Appendix page 2"}, {"page": 15, "text": "   OFFICIAL MASTER MANUAL AMENDMENT — v2.5.1\n\n Approval: Organizer-approved clarification of seven rules gaps. This appendix supersedes only conflicting older provisions\n concerning action limits, simultaneous timing, combat randomness, base capture, counterfire/Overwatch, scoring definitions\n and victory conditions. All v2.5 rules, including weapon statistics, five damage classes, battlefield 1–8–7 / 2–open–6 / 3–4–5,\n  terrain, objectives, ammunition, hostages and rebuilding, remain in force.\n\n 25. Unit action limits and legal combinations\n Each operational unit has at most one movement opportunity and one primary action per round. The primary action is\n one of: attack (including a permitted shot count), reload, Overwatch contingent attack, Suppressive Fire, melee/capture\n attempt, or another specifically approved action. A unit may move and take one primary action in the same round if\n movement, position, timing, weapon handling and firing lines permit. A reload replaces an attack; it never grants additional\n shots. A unit may not attack and reload in the same round under ordinary rules.\n\n Guard and Take Cover are tactical declarations that describe intended positioning or protection; neither creates a second\n primary action or free movement. Retreat/Withdraw is a movement declaration and consumes the ordinary movement\n  opportunity. Any weapon attack included with a stance consumes the same single primary action. Dual-wielding, multiple\n  barrels, automated sentries and combined weapons grant no extra primary action absent an independently inspected,\n  explicitly approved exception. Apply the existing reload limit of once per unit per round unless an inspected automatic loader\n has approved exceptions.\n\n When a special action has not been assigned an approved action cost, mark it Pending and ask the organizer before\n  resolution. No action is preselected by the referee.\n\n 26. Simultaneous resolution and casualty timing\n  Collect all players’ orders, validate them together, and resolve accepted actions in one simultaneous round. Determine each\n  unit’s legal movement path and its declared attack or trigger opportunity using verified physical positions, routes, arcs, range,\n  visibility and obstacles. A unit whose attack was legal when its declared firing opportunity occurred still resolves that attack\n even if an opposing simultaneous attack eliminates it during the same round. This prevents first-reported-player advantage.\n\n Adjudicate legal attacks and damage before applying their resulting casualties and component failures together at round end.\n An asset already nonfunctional at round start cannot act unless a validated repair or other specifically approved condition\n restores function in time; do not invent an in-round repair timing exception. Movement-dependent interactions (contact,\n pickups, arrival, base occupation) require verification against the declared paths and the simultaneous end-of-round state.\n When competing interactions cannot be resolved without a missing timing fact, hold only the affected interaction Pending and\n request that fact.\n\n 27. Transparent simulated combat randomness\n The referee uses ChatGPT-simulated rolls, disclosed in the Round Report. For every attack or separately adjudicated shot\n as applicable, record: shooter and weapon ID, target ID, declared shots, legality, simulated hit roll/result, cover and armor\n assessment, separate simulated damage roll/result for each hit, final damage/condition and ammunition spent. Misses still\n consume ammunition. Hits do not automatically cause damage.\n\n Use a consistent impartial random scale and decision criteria announced before the first combat round of a campaign, record\n them in its ledger, and retain them for that campaign. This amendment does not approve a particular die size, fixed hit\n percentages, damage thresholds, critical-hit mechanic or automatic damage bonus. If numeric thresholds or\n  probabilities are necessary and not yet approved, ask the organizer to approve the proposed method before rolling; do not\n invent permanent mechanics. Disclose simulated values and the reasoning behind outcomes; never claim physical dice were\n  rolled or that simulated rolls are externally verifiable.\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE | MASTER MANUAL v2.5.1 — OFFICIAL AMENDMENT                             Appendix page 1"}, {"page": 16, "text": " 28. Base capture: uncontested control at round end\n Award the existing +15 only when at least one operational attacking minifigure reaches the verified boundaries of an active\n enemy base through a legal route, survives to round end and establishes uncontested control at the end of that round.\n Operational enemy defenders physically inside the base who contest control prevent capture. Presence outside the boundary\n or mere damage to defenses is insufficient. Verify actual positions, remaining defenders, hostage restrictions and\n simultaneous casualties before awarding. No additional hold round is required. Record the capturing player, base/plot, round\n and award key; do not repeatedly award the same capture without an organizer-approved change in control and scoring\n  eligibility.\n\n 29. Counterfire and Overwatch\n Counterfire is not an extra free attack. The defending player must declare a contingent attack before orders close:\n actor/weapon, watched direction or firing arc, target or precise trigger, requested shots and ammunition. This reserves and\n consumes the unit’s ordinary primary firing action when triggered; it cannot also fire a separate normal attack that round.\n Validate range, line of fire, arc, function and ammo at the triggering opportunity. If the trigger never occurs, the contingent\n attack does not fire and spends no ammunition. All valid triggered attacks resolve within the simultaneous round under\n section 26. No retroactive counterfire after seeing results.\n\n 30. Exact scoring triggers\n Repel attack (+3): An actual verified enemy assault against an occupied base fails to establish control, while its defenders\n maintain control through the end of the round. Award at most once per defending base per round, regardless of the number\n  of attackers; do not award merely for a distant missed shot or an unexecuted attack order. Survive operational round (+2):\n Award once per occupied base per completed round when at least one defending unit or inspected defensive asset remains\n operational at round end. Record the specific surviving asset and avoid duplicate awards. Eliminations, destruction,\n capture and objectives: retain the existing scoring table and one-time permanent-ID / objective safeguards. Do not create\n  additional scoring categories.\n\n 31. Victory, surrender and ties\n The organizer defines the campaign victory condition during registration and it is recorded before building or combat.\n The referee must ask for the precise condition, including any round cap, target score, last-base criterion, tie-breaker and\n surrender handling as relevant; none is selected by default. Evaluate victory only against that announced condition, after\n completing the round’s simultaneous resolution, scoring and dashboard. If the condition is met, report the winner or declared\n  tie and stop combat scoring unless the organizer explicitly authorizes a new campaign or continuation. If no victory condition\n was registered, mark it Pending and obtain organizer approval before the first round; do not declare a winner by\n improvisation.\n\n 32. Mandatory workflow integration and precedence\n Registration: capture organizer-defined victory condition and combat randomization method/approved thresholds. Quick\n Battle Orders: display remaining movement and one primary-action choice per operational unit; show optional contingent\n  triggers without preselecting. Validation: reject incompatible action combinations, double fire, illegal captures and undefined\n random thresholds. Round Report: disclose simulated rolls, action resolution, ammunition, simultaneous casualties, repelled\n  assaults, survival awards and capture checks. Dashboard: show victory progress and any Pending rulings. Rebuilding:\n  retain all previous phase and inspection procedures unchanged.\n\n Version precedence: v2.5.1 clarification controls the seven subjects above; v2.5 controls tactical stances, terrain and\n expanded objectives; v2.4.1 controls Plot 8 geometry; earlier v2.4 sections control all unchanged rules. Project Instructions\n remain unchanged and refer generically to the latest approved Master Manual.\n\n\n\n\n\nLEGO BATTLE CAMPAIGN ENGINE | MASTER MANUAL v2.5.1 — OFFICIAL AMENDMENT                             Appendix page 2"}];
function manualPage(){return `<div class="card"><h2>Master Manual v2.5.1 — Official Reference</h2><p>Complete 16-page manual text is embedded for offline access. The latest approved amendment takes precedence: v2.5.1 → v2.5 → v2.4.1 → v2.4. This reference is not an automatic rules interpreter. Unapproved random thresholds and missing physical facts remain Pending.</p><label>Search manual<input id="manualSearch" placeholder="Search rules, weapons, scoring..." oninput="filterManual(this.value)"></label><div id="manualResults">${MANUAL_PAGES.map(p=>`<details><summary>Page ${p.page}</summary><pre style="white-space:pre-wrap;font-family:inherit">${esc(p.text)}</pre></details>`).join('')}</div></div>`}
function filterManual(q){const x=q.toLowerCase().trim();document.getElementById('manualResults').innerHTML=MANUAL_PAGES.filter(p=>!x||p.text.toLowerCase().includes(x)).map(p=>`<details ${x?'open':''}><summary>Page ${p.page}</summary><pre style="white-space:pre-wrap;font-family:inherit">${esc(p.text)}</pre></details>`).join('')||'<p>No matching pages.</p>'}

if(new URLSearchParams(location.search).get('display')==='public'){
 document.body.classList.add('public-view');document.querySelector('header').remove();document.getElementById('nav').remove();document.getElementById('app').remove();let root=document.createElement('div');root.id='publicRoot';document.body.appendChild(root);window.addEventListener('storage',renderPublic);if(window.presentationChannel)window.presentationChannel.onmessage=renderPublic;renderPublic();
}else{render();}

// AI integration is opt-in. Never embed API keys in a downloadable HTML file.
function aiSettingsPanel(){return `<div class="card"><h2>AI Connection (optional)</h2><p>Enter the URL of a trusted HTTPS backend that you operate. The backend must authenticate requests and keep the model API key server-side. The browser never stores an API key.</p><label>Secure AI service endpoint <input id="aiEndpoint" type="url" placeholder="https://your-server.example/api/inspect" value="${esc(localStorage.getItem('legoAiEndpoint')||'')}"></label><button onclick="setAiEndpoint()">Save endpoint</button><p class="muted">Without a configured backend, local rule-based inspection checks remain available. This download does not include a hosted AI service.</p></div>`}
function setAiEndpoint(){let u=val('aiEndpoint');if(u&&!/^https:\/\//i.test(u))return alert('Use an HTTPS endpoint.');localStorage.setItem('legoAiEndpoint',u);alert('Endpoint saved on this Chromebook.');}
const inspectionQuestions=[
 ['names and IDs',/\b(name|named|id|called)\b/i,'Provide player-chosen names for every significant asset; the application assigns permanent IDs when registered.'],
 ['troop condition',/\b(healthy|wounded|eliminated|condition)\b/i,'Confirm health and operational condition of each minifigure.'],
 ['position',/\b(position|located|north|south|east|west|center|inside|outside|at )\b/i,'Specify actual positions for each asset.'],
 ['weapons',/\b(weapon|rifle|gun|pistol|laser|turret|rocket|sword|wrench|cannon|sentry)\b/i,'Identify each equipped or independent weapon and its operator.'],
 ['ammunition',/\b(ammo|ammunition|loaded|reserve|magazine|rounds|missiles|shots|capacity)\b/i,'Record loaded, capacity, reserve, ammo type, and reload method for every weapon.'],
 ['defenses',/\b(wall|defense|barricade|gate|entrance|firing port)\b/i,'Inspect all sides of walls: height, thickness, openings, reinforcement, cover, and damage.'],
 ['routes and visibility',/\b(route|distance|inch|line of sight|firing line|arc|opening|obstacle)\b/i,'Verify relevant physical routes, distances, firing lines, and arcs.'],
 ['terrain',/\b(terrain|rubble|forest|water|bridge|elevation|cover)\b/i,'Describe tactically relevant terrain, cover, elevation, and passability.'],
 ['hostages and special assets',/\b(hostage|none|special|holding|guard)\b/i,'Confirm hostages, guards, holding facilities, and special assets, or explicitly state None.']
];
function getInspectionContext(){let plot=Number(val('inspectP'));let p=state.players.find(x=>x.plot===plot);return {player:p,assets:state.assets.filter(a=>a.plot===plot),weapons:state.weapons.filter(w=>state.assets.some(a=>a.id===w.owner&&a.plot===plot))};}
function localInspectionAnalysis(){let d=val('aiDescription'),target=el('aiAnalysis');if(!d){target.textContent='Enter an inspection description first.';return}let missing=inspectionQuestions.filter(([n,re])=>!re.test(d));let found=inspectionQuestions.filter(([n,re])=>re.test(d)).map(x=>x[0]);let ctx=getInspectionContext();target.innerHTML=`<strong>Local checklist analysis — not an AI model</strong><p>Topics mentioned: ${esc(found.join(', ')||'None detected')}.</p><p><strong>Questions to verify:</strong></p><ul>${missing.map(x=>`<li>${esc(x[2])}</li>`).join('')||'<li>All topic keywords appeared, but every actual value still requires inspection and confirmation.</li>'}</ul><p>Registered for this base: ${ctx.assets.length} assets; ${ctx.weapons.length} weapons. Descriptions are not automatically treated as verified facts.</p><button onclick="saveInspectionDraft()">Save description as unverified notes</button>`;}
function saveInspectionDraft(){let ctx=getInspectionContext();if(!ctx.player)return;let d=val('aiDescription');if(!d)return;ctx.player.aiDraft=d;save();alert('Unverified inspection description saved. Complete structured registration and validation separately.');}
async function connectedInspectionAnalysis(){let d=val('aiDescription'),target=el('aiAnalysis'),url=localStorage.getItem('legoAiEndpoint');if(!d)return alert('Enter an inspection description.');if(!url)return target.textContent='No AI backend connected. Open Save / Load → AI Connection to configure a secure HTTPS service. Local checklist analysis works without one.';let ctx=getInspectionContext();target.textContent='Requesting analysis…';try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);let response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'inspection_review',manualVersion:'2.5.1',description:d,player:ctx.player,assets:ctx.assets,weapons:ctx.weapons,instructions:'Do not invent facts, names, measurements, ammo, combat probabilities or approvals. Return clarifications and suggestions only. The referee confirms all entries.'}),signal:controller.signal});clearTimeout(timer);if(!response.ok)throw Error('Service returned HTTP '+response.status);let data=await response.json();target.textContent=typeof data.analysis==='string'?data.analysis:typeof data.message==='string'?data.message:'Backend returned no analysis text. Expected JSON with analysis or message.';}catch(e){target.textContent='AI connection unavailable: '+e.message+'. Local inspection remains usable.'}}
</script></html>
