<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO Battle Campaign Engine</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fa;color:#20252b;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;line-height:1.5}header{padding:26px clamp(18px,4vw,48px);background:#fff;border-bottom:1px solid #e5e7eb}h1{margin:0;font-size:24px;letter-spacing:-.045em;font-weight:650}h2,h3{letter-spacing:-.035em}small,.muted{color:#737b85}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px clamp(18px,4vw,48px);background:#fff;border-bottom:1px solid #e5e7eb}button,input,select,textarea{font:inherit;border-radius:8px;padding:10px 12px;border:1px solid #d9dde3}button{background:#20252b;color:#fff;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}button:hover{background:#39414a}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #768ea7;outline-offset:2px}nav button{background:transparent;color:#59636e;border:1px solid transparent;font-size:13px;font-weight:550;padding:9px 11px}nav button:hover{background:#f2f4f6;color:#20252b}nav button.active{background:#edf0f3;color:#171c22;border-color:#e2e5e9}main{max-width:1180px;margin:auto;padding:28px 20px 60px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px rgba(16,24,40,.025)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:6px;font-size:13px;color:#525b66;font-weight:550}input,select,textarea{background:#fff;color:#20252b;min-width:0;max-width:100%}input::placeholder,textarea::placeholder{color:#9ca3af}textarea{min-height:80px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{background:#fff8eb;color:#77591b;border:1px solid #f3e5c8;padding:12px;border-radius:8px}.good{background:#eef8f1;color:#25603a;border:1px solid #d7eadd}.plot{border:1px solid #cfd6dd;background:#fbfcfd;border-radius:10px;min-height:90px;display:grid;place-items:center;text-align:center;padding:12px}.field{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e8eaed;padding:11px;text-align:left}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6c7580;font-weight:650}section[hidden]{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #e8eaed}@media(max-width:650px){.field{grid-template-columns:1fr}main{padding:16px}header{padding:20px}nav{padding:10px}}
button:disabled{opacity:.38;cursor:not-allowed} details{padding:12px;border-bottom:1px solid #ddd}details summary{cursor:pointer;font-weight:600}#manualResults{max-height:65vh;overflow:auto}.ai-card{border:1px solid #dedede;border-radius:12px;padding:18px;background:#fafafa;margin:16px 0}.ai-card textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:12px;font:inherit}.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.ai-result{background:white;border:1px solid #e2e2e2;padding:12px;border-radius:8px;white-space:normal}.ai-result li{margin:5px 0}</style><header><h1>🧱 LEGO Battle Campaign Engine</h1><small>Standalone prototype • Manual v2.5.1 • Browser-local campaign storage</small></header><nav id="nav"></nav><main id="app"></main><script>
const TABS=['Campaign Registration','Battlefield','Base Inspection','Weapon Armory','Quick Battle Orders','Validation','Round Report','Battlefield Status Dashboard','Rebuilding Inspection','Save / Load','Presentation Control','Master Manual'];
const WEAPONS=[['Military — Handheld','Handgun / Pistol','Light','Handheld','Small one-handed firearm',8,1,3],['Military — Handheld','Submachine Gun (SMG)','Light proposed','Handheld','Compact rapid-fire firearm'],['Military — Handheld','Automatic Rifle','Light','Handheld','Long automatic firearm',16,1,5],['Military — Handheld','Assault Rifle','Light proposed','Handheld','Magazine-fed military rifle'],['Military — Handheld','Shotgun','Light proposed','Handheld','Short-range scatter firearm'],['Military — Handheld','Sniper Rifle','Medium','Handheld','Long precision rifle',30,1,1],['Military — Handheld','Machine Gun','Medium','Either','High-volume automatic gun',20,3,8],['Military — Handheld','Minigun','Heavy proposed','Either','Multiple rotating barrels'],['Military — Handheld','Rocket Launcher','Heavy','Handheld','Shoulder-fired rocket tube',30,1,1],['Military — Handheld','Grenade Launcher','Medium proposed','Handheld','Launches grenade projectiles'],['Military — Handheld','Flamethrower','Medium proposed','Handheld','Fuel-based flame projector'],['Military — Mounted','Mortar','Heavy proposed','Mounted','Short tube for indirect fire'],['Military — Mounted','Artillery Cannon','Devastating proposed','Mounted','Large long-barreled field gun'],['Military — Mounted','Tank Cannon','Heavy proposed','Mounted','Armored vehicle main gun'],['Sci-fi / Energy','Laser Pistol','Very Light proposed','Handheld','Compact energy handgun'],['Sci-fi / Energy','Laser Rifle','Light','Handheld','Long energy rifle',20,1,3],['Sci-fi / Energy','Laser Cannon','Medium','Mounted','Mounted beam cannon',30,1,2],['Sci-fi / Energy','Plasma Rifle','Medium proposed','Handheld','Futuristic plasma rifle'],['Sci-fi / Energy','Plasma Cannon','Devastating proposed','Mounted','Large high-energy cannon'],['Sci-fi / Energy','Energy Blaster','Very Light proposed','Handheld','Small general-purpose blaster'],['Sci-fi / Energy','Railgun','Heavy proposed','Either','Electromagnetic gun'],['Sci-fi / Energy','EMP Launcher','Medium proposed','Either','Electronic disruption device'],['Sci-fi / Energy','Pulse Cannon','Heavy proposed','Mounted','Mounted pulse energy weapon'],['Sci-fi / Energy','Ion Cannon','Heavy proposed','Mounted','Large ion-themed cannon'],['Sci-fi / Energy','Missile Turret','Heavy','Mounted','Rotating missile platform',36,1,3],['Defense / Melee','Double-Barreled Sentry','Light','Mounted','Fixed twin-barrel defensive gun',20,2,2],['Defense / Melee','Automated Machine-Gun Sentry','Medium proposed','Mounted','Automatic defensive machine gun'],['Defense / Melee','Sword','Light proposed','Handheld','Contact melee'],['Defense / Melee','Energy Sword','Medium proposed','Handheld','Glowing contact blade'],['Defense / Melee','Whip','Very Light proposed','Handheld','Flexible contact weapon'],['Defense / Melee','Cleaver','Light proposed','Handheld','Broad chopping blade'],['Defense / Melee','Wrench','Very Light proposed','Handheld','Improvised melee tool'],['Defense / Melee','Spear','Light proposed','Handheld','Long pointed contact weapon'],['Defense / Melee','Explosive Charge','Heavy proposed','Handheld','Placed charge requiring approval'],['Defense / Melee','Other - Custom Weapon','Pending','As inspected','Describe construction and proposed effects']];
const AMMO=['Standard ballistic rounds','Shotgun shells','Armor-piercing rounds','Explosive rounds','Rockets','Missiles','Grenades','Flamethrower fuel','Laser energy charges','Plasma cells','Ion cells','Railgun projectiles','EMP charges','Rechargeable energy supply','No ammunition - Melee','Other - Custom Ammunition'];const RELOAD=['Manual magazine replacement','Individual round loading','Rocket/missile replacement','Energy cell replacement','Recharge mechanism','Inspected automatic loader','No reload required','Other - Custom Reload'];const CONFIG=['Dual-wielding','Two-handed','One-handed','Vehicle-mounted','Turret-mounted','Stationary/fixed','Modified/upgraded','Multiple barrels','Special ammunition','Scope/targeting attachment','Shield + weapon','Combination weapon','Other configuration'];const ATTACH=['Iron sights / No scope','Red-dot sight','Holographic sight','Magnified scope','Sniper scope','Thermal scope','Night-vision scope','Laser sight','Rangefinder','Suppressor','Extended barrel','Short barrel','Bipod / Tripod','Foregrip','Extended magazine','Drum magazine','Bayonet','Underbarrel launcher','Flashlight','Cooling system','Stabilizer','Energy focusing lens','Targeting computer','Power amplifier','Heat sink','Recharge module','Other - Custom Attachment'];
const fresh=()=>({mode:'',base8:'inactive',victory:'',victoryType:'points',victoryTarget:'',victoryRounds:'',victoryTiebreak:'',victorySurrender:'',random:'',combatType:'balanced',players:[],assets:[],weapons:[],orders:{},round:1,phase:0,registrationLocked:false,buildStartedAt:null,reports:[],objectives:[],terrain:[],created:new Date().toISOString()});let state=load()||fresh(),tab=0;function load(){try{return JSON.parse(localStorage.getItem('legoCampaignV1'))}catch{return null}}function save(){localStorage.setItem('legoCampaignV1',JSON.stringify(state));localStorage.setItem('legoPublicPulse',String(Date.now()))}function el(id){return document.getElementById(id)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function opts(a,selected){return a.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}function select(id,a,selected){return `<select id="${id}">${opts(a,selected)}</select>`}function field(id,label,value='',type='text'){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`}function val(id){return el(id)?.value.trim()||''}function checkboxes(arr,cls){return arr.map((v,i)=>`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" class="${cls}" value="${esc(v)}">${esc(v)}</label>`).join('')}function checks(cls){return [...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value)}function playerOptions(){return state.players.map(p=>`<option value="${esc(p.plot)}">${esc(p.name)} — ${esc(p.base)} (Plot ${p.plot})</option>`).join('')}function assetOptions(){return state.assets.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} (${a.id})</option>`).join('')}function registrationReady(){return registrationMissing().length===0}
function inspectionProgress(){return state.players.filter(p=>p.inspected===true).length}
function inspectionComplete(){return state.registrationLocked&&state.players.length>=2&&inspectionProgress()===state.players.length}
function allowedTab(i){return i===0||i===11||(state.registrationLocked&&(i===2||i===9||i===10||inspectionComplete()))}
function render(){if(!allowedTab(tab))tab=state.registrationLocked?2:0;save();el('nav').innerHTML=TABS.map((x,i)=>`<button class="${i===tab?'active':''}" ${!allowedTab(i)?'disabled title="Finish registration and all base inspections first"':''} onclick="tab=${i};render()">${x}${!allowedTab(i)?' 🔒':''}</button>`).join('');let out='';if(tab===0)out=registration();if(tab===1)out=battlefield();if(tab===2)out=inspection();if(tab===3)out=armory();if(tab===4)out=orders();if(tab===5)out=validation();if(tab===6)out=reports();if(tab===7)out=dashboard();if(tab===8)out=rebuild();if(tab===9)out=saveLoad()+aiSettingsPanel();if(tab===10)out=presentationControl();if(tab===11)out=manualPage();el('app').innerHTML=out;if(tab===2)inspectFields()}
function registration(){return `<div class="card"><h2>Campaign Registration — Step 1</h2><p class="notice">Registration is required before the battlefield, armory, or referee dashboard becomes available. Complete mode, Plot 8 status, victory condition, approved randomness method, and 2–8 registered players.</p><div class="grid"><label>Mode${select('mode',['','official','test'],state.mode)}</label><label>Plot 8 status${select('b8',['inactive','neutral','occupiable'],state.base8)}</label><label>Victory condition<select id="victoryType" onchange="toggleVictoryFields()">${[['points','Points Victory (recommended)'],['rounds','Highest Score After X Rounds'],['lastbase','Last Base Standing'],['captures','Base Capture Victory'],['custom','Other — Custom Victory']].map(([v,t])=>`<option value="${v}" ${state.victoryType===v?'selected':''}>${t}</option>`).join('')}</select></label>${field('victoryTarget','Target score / captures (as applicable)',state.victoryTarget,'number')}${field('victoryRounds','Round limit (as applicable)',state.victoryRounds,'number')}${field('victory','Victory details / exact criteria',state.victory)}${field('victoryTiebreak','Tie-breaker / tie handling',state.victoryTiebreak)}${field('victorySurrender','Surrender handling',state.victorySurrender)}<label>Combat method<select id="combatType">${[['balanced','Balanced Tactical Combat'],['dice','Dice-Based Combat'],['detailed','Detailed Tactical Combat'],['simplified','Simplified Combat'],['custom','Other — Custom Combat Method']].map(([v,t])=>`<option value="${v}" ${state.combatType===v?'selected':''}>${t}</option>`).join('')}</select></label>${field('random','Approved random scale, hit/damage thresholds and criteria',state.random)}</div><p><button onclick="saveCampaignSettings()">Save campaign settings</button> <span id="registrationSaveStatus" class="muted" role="status">Changes save automatically as you type</span></p><p class="muted">Victory and randomization must be approved before combat. Initial build: 40 minutes. Points Victory is preselected but requires your target and approval. Combat methods are selectable proposals; no hit probabilities or damage thresholds are assumed.</p></div><div class="card"><h3>Register player</h3><div class="grid">${field('pname','Player name')}${field('bname','Player-chosen base name')}<label>Plot${select('plot',[1,2,3,4,5,6,7,...(state.base8==='occupiable'?[8]:[])].map(String))}</label></div><p><button onclick="addPlayer()">Add player</button></p><table><tr><th>Player</th><th>Base</th><th>Plot</th><th>Score</th><th></th></tr>${state.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.base)}</td><td>${p.plot}</td><td>${p.score||0}</td><td>${state.registrationLocked?'Locked':`<button onclick="removePlayer(${p.plot})">Remove</button>`}</td></tr>`).join('')}</table></div><div class="card"><h3>Complete registration</h3><div id="registrationBlockers" class="notice" hidden></div><p>${state.registrationLocked?'Registration locked. Initial building stage active.':'At least two registered players and all mandatory campaign settings are required. Save settings before locking. Missing requirements will be listed below.'}</p><button ${state.registrationLocked?'disabled':''} onclick="completeRegistration()">${state.registrationLocked?'Registration completed':'Lock registration & begin 40-minute build'}</button>${!state.registrationLocked?`<p class="notice"><strong>Still needed:</strong><br>${registrationMissing().length?registrationMissing().map(esc).join('<br>'):'All registration requirements completed.'}</p>`:''}${state.buildStartedAt?`<p class="good">Building began: ${new Date(state.buildStartedAt).toLocaleString()} · Duration: 40 minutes</p>`:''}</div>`}function toggleVictoryFields(){persistRegistrationDraft();render()}
function registrationMissing(){let m=[];
 if(!['official','test'].includes(state.mode))m.push('Select Official or Test mode.');
 if(!state.victory?.trim())m.push('Enter exact victory criteria.');
 if(!state.victoryTiebreak?.trim())m.push('Enter tie handling (for example: declare a tie).');
 if(!state.victorySurrender?.trim())m.push('Enter surrender handling.');
 if(['points','captures'].includes(state.victoryType)&&!(Number(state.victoryTarget)>0))m.push('Enter a positive target score / capture count.');
 if(state.victoryType==='rounds'&&!(Number(state.victoryRounds)>0))m.push('Enter a positive round limit.');
 // Randomization may remain Pending during registration, but combat must remain blocked until approved.
 if(!state.random?.trim())m.push('Enter the approved combat randomization criteria, or type Pending approval.');
 if(state.players.length<2)m.push('Register at least two players.');
 if(state.players.length>(state.base8==='occupiable'?8:7))m.push('Too many players for the selected Plot 8 status.');
 if(state.players.some(p=>!p.name?.trim()||!p.base?.trim()))m.push('Every player needs a player name and base name.');
 if(new Set(state.players.map(p=>p.plot)).size!==state.players.length)m.push('Each player needs a unique plot.');
 if(state.players.some(p=>p.plot===8)&&state.base8!=='occupiable')m.push('Plot 8 must be occupiable for a player to register there.');
 return m;
}
function captureRegistrationFields(){for(const [key,id] of [['mode','mode'],['base8','b8'],['victory','victory'],['victoryType','victoryType'],['victoryTarget','victoryTarget'],['victoryRounds','victoryRounds'],['victoryTiebreak','victoryTiebreak'],['victorySurrender','victorySurrender'],['combatType','combatType'],['random','random']]){if(el(id))state[key]=val(id)}}
let registrationAutosaveTimer=null;
function persistRegistrationDraft(){
 if(state.registrationLocked)return;
 captureRegistrationFields();
 try{save();setRegistrationSaveStatus('Saved locally · '+new Date().toLocaleTimeString());}
 catch(err){setRegistrationSaveStatus('Local saving unavailable — export a backup from Save / Load.');}
}
function setRegistrationSaveStatus(message){let node=el('registrationSaveStatus');if(node)node.textContent=message;}
function registrationInputChanged(){
 setRegistrationSaveStatus('Saving…');
 clearTimeout(registrationAutosaveTimer);
 registrationAutosaveTimer=setTimeout(persistRegistrationDraft,250);
}
document.addEventListener('input',e=>{if(e.target.closest('#app')&&tab===0&&e.target.matches('input,select,textarea'))registrationInputChanged();});
document.addEventListener('change',e=>{if(e.target.closest('#app')&&tab===0&&e.target.matches('input,select,textarea'))registrationInputChanged();});
window.addEventListener('beforeunload',()=>{if(tab===0&&!state.registrationLocked)persistRegistrationDraft();});
function saveCampaignSettings(){if(state.registrationLocked)return alert('Registration is locked. Start a new campaign to change setup.');state.mode=val('mode');state.base8=val('b8');state.victory=val('victory');state.victoryType=val('victoryType');state.victoryTarget=val('victoryTarget');state.victoryRounds=val('victoryRounds');state.victoryTiebreak=val('victoryTiebreak');state.victorySurrender=val('victorySurrender');state.combatType=val('combatType');state.random=val('random');save();render();setRegistrationSaveStatus('Saved locally · '+new Date().toLocaleTimeString());}function removePlayer(plot){if(state.registrationLocked)return;state.players=state.players.filter(p=>p.plot!==plot);render()}function completeRegistration(){
 clearTimeout(registrationAutosaveTimer);
 captureRegistrationFields();
 const missing=registrationMissing();
 if(missing.length){
  save();render();
  const box=el('registrationBlockers');
  if(box){box.hidden=false;box.innerHTML='<strong>Cannot begin building yet. Complete these items:</strong><ul>'+missing.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';box.scrollIntoView({behavior:'smooth',block:'center'});}
  return;
 }
 if(!confirm('Lock registration and start the 40-minute building phase?'))return;
 state.registrationLocked=true;state.buildStartedAt=new Date().toISOString();save();tab=2;render();
}function addPlayer(){captureRegistrationFields();let name=val('pname'),base=val('bname'),plot=Number(val('plot'));if(state.registrationLocked)return alert('Registration is locked.');if(!name||!base||state.players.some(p=>p.plot===plot)||state.players.length>=(state.base8==='occupiable'?8:7))return alert('Provide both names and an unused permitted plot.');state.players.push({name,base,plot,score:0,inspected:false,walls:'',terrain:'',notes:''});render()}function battlefield(){let positions=[1,8,7,2,0,6,3,4,5];return `<div class="card"><h2>Battlefield</h2><p>Adjacent plot edges: 2 inches. Diagram is schematic, not a distance measurement.</p><div class="field">${positions.map(n=>`<div class="plot">${n?`Plot ${n}<br>${esc(state.players.find(p=>p.plot===n)?.base||(n===8?state.base8:'Unoccupied'))}`:'OPEN CENTER'}</div>`).join('')}</div><p class="notice">Actual firing distances, routes, clearance, cover, and firing lines require physical verification.</p></div>`}function inspection(){let p=state.players.find(p=>!p.inspected)||state.players[state.players.length-1];if(!p)return '<p>No registered players.</p>';let mine=state.assets.filter(a=>a.plot===p.plot);let weapons=state.weapons.filter(w=>mine.some(a=>a.id===w.owner));return `<div class="card"><h2>Base Inspection — Step 3</h2><section class="ai-card"><h3>Inspection Assistant · Referee Review</h3><p class="muted">Describe the physical LEGO base in plain language. Local analysis identifies missing facts; optional connected AI can suggest structured notes. Nothing is approved or added automatically.</p><textarea id="aiDescription" rows="5" placeholder="Example: This base has two named soldiers behind a wall, a wheeled truck, and a turret. Describe what is physically present, positions, ammo, and measurements you verified."></textarea><div class="ai-actions"><button type="button" onclick="localInspectionAnalysis()">Check description</button><button type="button" onclick="connectedInspectionAnalysis()">Ask connected AI</button></div><div id="aiAnalysis" class="ai-result" aria-live="polite">Awaiting description.</div></section><p class="notice">Complete the inspection for each base in registration order. ${inspectionProgress()} of ${state.players.length} bases confirmed. Battle screens stay locked until every base is inspected.</p><label>Current base<select id="inspectP" onchange="inspectFields()">${state.players.map(x=>`<option value="${x.plot}" ${x.plot===p.plot?'selected':''}>${esc(x.name)} — ${esc(x.base)} (Plot ${x.plot}) ${x.inspected?'✓':''}</option>`).join('')}</select></label><div id="inspectFields"></div></div><div class="card"><h3>Register named assets — required before approval</h3><p class="muted">Record each minifigure, sentry, turret, independent weapon, vehicle, robot, aircraft, major structure and special asset. Give each a player-chosen name.</p><div class="grid"><label>Owner<select id="assetP">${playerOptions()}</select></label>${field('assetName','Player-chosen asset name')}<label>Asset category${select('assetType',['Minifigure','Sentry','Turret','Independent weapon','Vehicle','Robot','Aircraft','Major structure','Special asset'])}</label>${field('assetPosition','Verified position')}${field('assetArmor','Armor / cover')}${field('assetElevation','Elevation')}${field('assetDetails','Equipment / mobility / occupants / route / condition')}</div><p><button onclick="addAsset()">Register asset</button></p><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Position</th><th>Condition</th></tr>${state.assets.map(a=>`<tr><td>${a.id}</td><td>${esc(a.name)}</td><td>${a.type}</td><td>${esc(a.position)||'Pending'}</td><td>${a.condition}</td></tr>`).join('')}</table><p class="notice">Weapons and ammunition must also be inspected. Weapon Armory remains locked until inspections finish; use the inspection's weapon entry section below for recording weapons.</p></div>`}
function inspectFields(){let p=state.players.find(p=>p.plot===Number(val('inspectP')));if(!p)return;let mine=state.assets.filter(a=>a.plot===p.plot);let missing=[];if(!mine.length)missing.push('No named assets registered');for(let a of mine){if(!a.position||!a.armor||!a.elevation||!a.details)missing.push(`${a.name}: missing position, armor/cover, elevation or equipment/details`)}if(!p.walls)missing.push('Walls and defenses');if(!p.terrain)missing.push('Terrain, routes and physical measurements');if(!p.notes)missing.push('Hostages, firing arcs, special assets and other inspection notes (enter None if verified absent)');let w=state.weapons.filter(w=>mine.some(a=>a.id===w.owner));if(!w.length)missing.push('Weapons and ammunition not registered (record None if genuinely no weapons)');el('inspectFields').innerHTML=`<div class="card" style="margin-top:16px"><h3>${esc(p.base)} — Complete physical inspection</h3><p><b>1.</b> Troops, names/IDs, health, equipment, armor, positions, cover and elevation<br><b>2.</b> Weapons, configuration, attachments, firing arcs, ammo loaded/capacity/reserve<br><b>3.</b> Walls on all sides, construction, openings and damage<br><b>4.</b> Vehicles, passengers, mobility and routes<br><b>5.</b> Terrain, obstacles, elevation and visibility<br><b>6.</b> Hostages, special assets and outstanding measurements</p><div class="grid">${field('walls','All wall sides: height, thickness, reinforcement, openings, cover and damage',p.walls)}${field('terrain','Terrain, routes, obstacles, visibility and measurements',p.terrain)}${field('inotes','Other: hostages, special assets, firing arcs and missing fields (None if verified absent)',p.notes)}</div><p class="muted">Registered assets: ${mine.length}. Registered weapons: ${w.length}.</p><p class="notice">${missing.length?'Pending: '+missing.map(esc).join('; '):'Required summary fields recorded. Verify detailed weapon/asset fields and actual construction before approving.'}</p><label><input type="checkbox" id="inspected" ${p.inspected?'checked':''}> I have physically verified ALL mandatory fields, including complete weapon/ammunition details; no unresolved Pending items remain.</label><p><button onclick="saveBaseInspection()">Save &amp; validate this base</button></p></div>`}
function saveBaseInspection(){let p=state.players.find(p=>p.plot===Number(val('inspectP')));if(!p)return;p.walls=val('walls');p.terrain=val('terrain');p.notes=val('inotes');let mine=state.assets.filter(a=>a.plot===p.plot);let missing=[];if(!mine.length)missing.push('named assets');if(mine.some(a=>!a.position||!a.armor||!a.elevation||!a.details))missing.push('complete asset details');if(!p.walls||!p.terrain||!p.notes)missing.push('walls, terrain or other inspection notes');if(el('inspected').checked&&missing.length){p.inspected=false;render();return alert('Inspection remains Pending: '+missing.join(', '))}p.inspected=el('inspected').checked;if(p.inspected&&inspectionComplete())alert('All base inspections marked complete. Verify weapon details before any battle resolution.');render()}
function addAsset(){let plot=Number(val('assetP')),name=val('assetName'),type=val('assetType');if(!name)return alert('Player-chosen asset name required.');if(state.assets.some(a=>a.name.toLowerCase()===name.toLowerCase()))return alert('Asset name must be unique.');let code={'Minifigure':'T','Sentry':'S','Turret':'S','Independent weapon':'W','Vehicle':'V','Robot':'R','Aircraft':'A','Major structure':'B','Special asset':'X'}[type];let number=1,id;do{id=`B${plot}-${code}${String(number++).padStart(2,'0')}`}while(state.assets.some(a=>a.id===id));state.assets.push({id,plot,name,type,position:val('assetPosition'),armor:val('assetArmor'),elevation:val('assetElevation'),details:val('assetDetails'),condition:type==='Minifigure'?'Healthy':'Intact'});render()}function armory(){return `<div class="card"><h2>Weapon Selection and Configuration</h2><p>New catalog weapons require approved performance before combat.</p><div class="grid"><label>Owner/operator asset<select id="weaponOwner">${assetOptions()}</select></label>${field('weaponName','Player-chosen weapon name')}<label>Catalog selection<select id="weaponType">${WEAPONS.map((w,i)=>`<option value="${i}">${esc(w[0])} • ${esc(w[1])} • ${esc(w[2])} • ${esc(w[3])} • ${esc(w[4])}</option>`).join('')}</select></label>${field('weaponDetails','Open weapon details / custom weapon')}${field('loaded','Loaded', '', 'number')}${field('capacity','Capacity','','number')}${field('reserve','Reserve','','number')}${field('magazines','Spare magazines / quantities')}${field('weaponPosition','Location / firing arc / verified line')}${field('weaponApproved','Approved custom performance and effects')}</div><div class="grid"><label>Ammunition${select('ammo',AMMO)}</label><label>Reload method${select('reload',RELOAD)}</label></div><h4>Configurations</h4><div class="grid">${checkboxes(CONFIG,'cfg')}</div><h4>Scopes / attachments</h4><div class="grid">${checkboxes(ATTACH,'att')}</div><p><button onclick="addWeapon()">Register weapon</button></p></div><div class="card"><h3>Weapon inventory</h3><table><tr><th>ID / Name</th><th>Catalog</th><th>Loaded / Capacity / Reserve</th></tr>${state.weapons.map(w=>`<tr><td>${esc(w.id)} — ${esc(w.name)}</td><td>${esc(w.type)}</td><td>${w.loaded} / ${w.capacity} / ${w.reserve}</td></tr>`).join('')}</table></div>`}function addWeapon(){let owner=state.assets.find(a=>a.id===val('weaponOwner'));if(!owner)return alert('Register an operator/asset first.');let name=val('weaponName'),loaded=Number(val('loaded')),capacity=Number(val('capacity')),reserve=Number(val('reserve'));if(!name||['loaded','capacity','reserve'].some(id=>val(id)==='')||![loaded,capacity,reserve].every(Number.isInteger)||Math.min(loaded,capacity,reserve)<0||loaded>capacity)return alert('Enter a weapon name and valid actual loaded/capacity/reserve values.');let w=WEAPONS[Number(val('weaponType'))],i=1,id;do{id=`B${owner.plot}-W${String(i++).padStart(2,'0')}`}while(state.weapons.some(w=>w.id===id));state.weapons.push({id,name,owner:owner.id,plot:owner.plot,type:w[1],damage:w[2],range:w[5]??null,min:w[6]??null,max:w[7]??null,loaded,capacity,reserve,magazines:val('magazines'),position:val('weaponPosition'),ammo:val('ammo'),reload:val('reload'),config:checks('cfg'),attachments:checks('att'),details:val('weaponDetails'),approved:val('weaponApproved')});render()}function orders(){return `<div class="card"><h2>Quick Battle Orders — Round ${state.round}</h2><p>One movement opportunity and one primary action per operational unit. No actions preselected.</p>${state.players.map(p=>`<div class="card"><h3>${esc(p.name)} — ${esc(p.base)} (Plot ${p.plot})</h3>${state.assets.filter(a=>a.plot===p.plot).map(a=>{let o=state.orders[a.id]||{};return `<div class="card"><b>${esc(a.name)} (${a.id})</b> • ${esc(a.condition)} • ${esc(a.position)||'Position Pending'}<p class="muted">${state.weapons.filter(w=>w.owner===a.id).map(w=>`${esc(w.name)} (${w.id}): ${w.loaded} loaded / ${w.reserve} reserve`).join(' • ')||'No registered weapons'}</p><div class="grid"><label>Primary action<select id="act_${a.id}">${opts(['','None','Attack','Reload','Overwatch contingent attack','Suppressive Fire','Melee / Capture','Other - Custom'],o.action)}</select></label><label>Tactical action<select id="stance_${a.id}">${opts(['','None','Guard','Take Cover','Overwatch','Suppressive Fire','Retreat / Withdraw','Other - Custom Tactical Action'],o.stance)}</select></label>${field('move_'+a.id,'Movement path / measured distance',o.move)}${field('target_'+a.id,'Target ID / area / trigger',o.target)}${field('shots_'+a.id,'Requested shots',o.shots,'number')}${field('weapon_'+a.id,'Weapon ID / ammo source',o.weapon)}${field('tactic_'+a.id,'Cover / tactics / objective / hostage details',o.tactic)}</div></div>`}).join('')}<button onclick="saveOrders(${p.plot})">Save ${esc(p.name)} orders</button> <span>${state.orders['submitted_'+p.plot]?'Submitted':'Pending'}</span></div>`).join('')}</div>`}function saveOrders(plot){state.assets.filter(a=>a.plot===plot).forEach(a=>state.orders[a.id]={action:val('act_'+a.id),stance:val('stance_'+a.id),move:val('move_'+a.id),target:val('target_'+a.id),shots:val('shots_'+a.id),weapon:val('weapon_'+a.id),tactic:val('tactic_'+a.id)});state.orders['submitted_'+plot]=true;render()}function issues(){let x=[];if(state.players.length<2)x.push('At least two registered players required.');if(!state.mode)x.push('Campaign mode missing.');if(!state.victory)x.push('Victory condition Pending.');if(!state.random)x.push('Combat randomization criteria Pending.');for(let p of state.players){if(!p.inspected)x.push(`${p.name}: full base inspection Pending.`);if(!state.orders['submitted_'+p.plot])x.push(`${p.name}: battle orders Pending.`)}for(let a of state.assets){if(!a.position)x.push(`${a.id}: verified position Pending.`);let o=state.orders[a.id];if(!o)continue;if(['Attack','Overwatch contingent attack','Suppressive Fire'].includes(o.action)){let w=state.weapons.find(w=>w.id===o.weapon);if(!w||w.owner!==a.id)x.push(`${a.id}: valid owned weapon ID required.`);else{let n=Number(o.shots);if(!Number.isInteger(n)||n<1||n>w.loaded)x.push(`${a.id}: invalid shots or insufficient loaded ammunition.`);if(w.max!==null&&(n<w.min||n>w.max))x.push(`${a.id}: shot count outside approved weapon limits.`);if(w.max===null&&!w.approved)x.push(`${w.id}: proposed weapon performance needs organizer approval.`)}if(!o.target)x.push(`${a.id}: target or trigger missing.`)}if(o.action==='Reload'&&!o.weapon)x.push(`${a.id}: reload weapon ID missing.`);if(o.move&&!/\d/.test(o.move))x.push(`${a.id}: measured movement distance missing.`)}return x}function validation(){let x=issues();return `<div class="card"><h2>Validation — Round ${state.round}</h2><div class="${x.length?'notice':'good'}">${x.length?x.map(s=>`<p>⚠ ${esc(s)}</p>`).join(''):'Basic record checks passed. Physical verification and organizer approval are still required.'}</div><p><b>Physical checks remain mandatory:</b> routes, distances, walls, firing lines, arcs, cover, elevation, ammo compatibility, action timing, targets and objective eligibility.</p><p>This prototype does not automatically roll or resolve combat: no unapproved hit/damage thresholds will be invented.</p></div>`}function reports(){return `<div class="card"><h2>Round Report</h2><p class="notice">Combat adjudication is intentionally referee-entered in this prototype. Automatic resolution requires an approved, fully specified randomization method and physical validation.</p><label>Referee's validated round report<textarea id="report" placeholder="Enter actual simulated rolls, legal shots, misses, damage, score events, ammo deductions and simultaneous outcomes."></textarea></label><p><button onclick="if(issues().length)return alert('Resolve validation issues first.');if(!val('report'))return alert('Enter the complete adjudicated report.');state.reports.push({round:state.round,text:val('report')});render()">Save referee report (no ledger mutations)</button></p>${state.reports.map(r=>`<div class="card"><b>Round ${r.round}</b><pre>${esc(r.text)}</pre></div>`).join('')}</div>`}function dashboard(){return `<div class="card"><h2>Battlefield Status Dashboard</h2><table><tr><th>Player / Base</th><th>Score</th><th>Assets</th><th>Weapons</th></tr>${state.players.map(p=>`<tr><td>${esc(p.name)}<br>${esc(p.base)} — Plot ${p.plot}</td><td>${p.score||0}</td><td>${state.assets.filter(a=>a.plot===p.plot).map(a=>`${esc(a.name)} (${a.id}): ${esc(a.condition)}`).join('<br>')||'Pending'}</td><td>${state.weapons.filter(w=>w.plot===p.plot).map(w=>`${esc(w.name)}: ${w.loaded}/${w.reserve}`).join('<br>')||'Pending'}</td></tr>`).join('')}</table><p class="muted">Scores and conditions change only through explicit verified ledger updates; this prototype does not claim combat has occurred.</p></div>`}function rebuild(){return `<div class="card"><h2>Rebuilding Inspection</h2><p>Current global phase: <b>${state.phase}</b>. Rebuilding time: 15 minutes after a completed round.</p><p>${state.phase>0&&state.phase%3===0?'Ammo Request eligible: verify compatibility, stock and approval.':'Ammo requests unlock at phases 3, 6, 9…'}</p><p>Existing names/IDs, ammunition, conditions, positions and weapons remain preserved. Changes must be inspected and entered in the relevant inventory forms.</p><p class="notice">Phase advancement is locked until a fully adjudicated round has updated all required ledgers. No automatic resupply.</p></div>`}function saveLoad(){return `<div class="card"><h2>Save / Load</h2><p>Data autosaves to this browser's local storage. Export regularly; clearing browser data can erase local saves.</p><p><button onclick="download()">Download campaign JSON</button> <button onclick="if(confirm('Start a completely new campaign?')){state=fresh();tab=0;render()}">New campaign / Reset</button></p><label>Import a previously exported campaign JSON<input type="file" accept=".json,application/json" onchange="importFile(this)"></label></div>`}function download(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lego-campaign-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function importFile(input){try{let obj=JSON.parse(await input.files[0].text());if(!Array.isArray(obj.players)||!Array.isArray(obj.assets)||!Array.isArray(obj.weapons))throw Error('Invalid campaign format');if(confirm('Replace current campaign with imported save?')){state=obj;tab=state.registrationLocked?1:0;render()}}catch(e){alert('Import failed: '+e.message)}}

ePresentation();render()">◀ Previous</button> <button onclick="presentation.eventIndex=Math.min(presentation.events.length-1,presentation.eventIndex+1);writePresentation();render()">Next ▶</button> <button onclick="if(confirm('Clear presentation events?')){presentation.events=[];presentation.eventIndex=0;writePresentation();render()}">Clear Events</button></p><div class="notice">${esc(presentation.events[presentation.eventIndex]||'No events entered')}</div></div><div class="card"><h3>Referee Tactical Map</h3><p>Click a registered base to highlight it on the public display.</p>${publicMap()}</div>`}
